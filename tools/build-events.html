<!doctype html>
<meta charset="utf-8">
<title>Сборка страниц мероприятий</title>
<!--
  Генератор статичных страниц мероприятий из js/events.js.
  Запуск: tools/build-events.ps1 (открывает эту страницу в headless Chrome и записывает файлы).
  Результат: event-<id>.html для каждого материала + статичные карточки в events.html.
-->
<pre id="out"></pre>
<script src="../js/events.js"></script>
<script>
  var V = new URLSearchParams(location.search).get('v') || '1';
  var E = window.ZC_EVENTS;
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var css = ['tokens', 'base', 'components', 'components-v2', 'pages', 'pages-v2'];
  var page = function (it) {
    return '<!doctype html>\n<html lang="ru">\n<head>\n' +
      '  <meta charset="utf-8">\n' +
      '  <meta name="viewport" content="width=device-width, initial-scale=1">\n' +
      '  <title>' + esc(it.title) + ' — Зелёное Царство</title>\n' +
      '  <meta name="description" content="' + esc(it.lead) + '">\n' +
      (it.example ? '  <meta name="robots" content="noindex, follow">\n' : '') +
      '  <link rel="preconnect" href="https://fonts.googleapis.com">\n' +
      '  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n' +
      '  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+Display:wght@250&family=Onest:wght@400;500&display=swap">\n' +
      css.map(function (c) { return '  <link rel="stylesheet" href="css/' + c + '.css?v=' + V + '">\n'; }).join('') +
      '</head>\n<body class="hdr-solid">\n' +
      '  <!-- Страница собрана tools/build-events.html из js/events.js — правки вносить в js/events.js и пересобирать -->\n' +
      '  <div data-zc="header"></div>\n  <div data-zc="menu"></div>\n\n' +
      E.main(it) +
      '\n  <div data-zc="footer"></div>\n' +
      '  <script src="js/layout.js?v=' + V + '"><\/script>\n' +
      '</body>\n</html>\n';
  };
  var files = {};
  E.items.forEach(function (it) { files[E.url(it)] = page(it); });
  var list = E.items.map(E.card).join('\n        ');
  document.getElementById('out').textContent = JSON.stringify({ files: files, list: list });
</script>
